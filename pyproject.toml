[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-training-lab-2"
version = "1.0.0"
description = "Agentic AI Training Lab 2: retrieval-augmented generation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv",
    "numpy",
    "pillow",
    "pypdf",
    "rank-bm25",
    "sentence-transformers",
]

[project.optional-dependencies]
vectordb = ["chromadb>=1.0"]

[project.scripts]
lab = "labkit.cli:main"

[tool.setuptools]
packages = ["labkit", "mylab"]

